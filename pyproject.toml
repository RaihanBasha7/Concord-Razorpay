[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "concord"
version = "0.1.0"
description = "Intelligent settlement reconciliation — precision-over-coverage deterministic matching."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "groq>=1.0.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "python-multipart>=0.0.6",
]
dev = [
    "pytest>=8.3.0",
    "httpx>=0.25.0",
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "python-multipart>=0.0.6",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["reconciliation*", "tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
